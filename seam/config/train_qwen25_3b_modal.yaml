TrainingArguments:
  output_dir: null
  per_device_train_batch_size: 8
  save_strategy: "steps"
  save_only_model: false
  save_total_limit: 2
  max_steps: 500
  learning_rate: !!float 2e-5
  weight_decay: 0.0
  save_steps: 100
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.1
  gradient_accumulation_steps: 1
  report_to: "none"
  logging_steps: 1
  bf16: true
  optim: "adamw_torch"
  max_grad_norm: null
  gradient_checkpointing: true
  gradient_checkpointing_kwargs: {"use_reentrant": false}
  dataloader_num_workers: 1
  dataloader_pin_memory: true
  seed: 42
  data_seed: 42

UnlearnArguments:
  model_name: "Qwen/Qwen2.5-3B-Instruct"
  tokenizer_name: "Qwen/Qwen2.5-3B-Instruct"
  attack_dataset: false
  defense_size: 4000
  epsilon: !!float 1e-3
  alpha: 1.0
  beta: 0.01
  include_test_dataset: false
  wandb_run_name: null
  wandb_project_name: "seam-qwen25-3b"
