# V5 qualification run. Direct AD + verified full-batch dual reference.
TrainingArguments:
  output_dir: "ckpt/cbg_v5_smoke_1b"
  per_device_train_batch_size: 8
  max_steps: 50
  learning_rate: !!float 3e-5
  weight_decay: 0.0
  save_strategy: "steps"
  save_steps: 25
  save_total_limit: 2
  save_only_model: False
  logging_steps: 1
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.1
  gradient_accumulation_steps: 1
  report_to: "none"
  bf16: False
  fp16: False
  optim: "adamw_torch"
  max_grad_norm: null
  gradient_checkpointing: False
  remove_unused_columns: False
  dataloader_drop_last: True
  seed: 42

CbgArguments:
  method: "cbg"
  cbg_version: "v5"
  spectral_derivative_backend: "direct_rof"
  geometry_solver: "dual"
  model_name: "meta-llama/Llama-3.2-1B-Instruct"
  tokenizer_name: "meta-llama/Llama-3.2-1B-Instruct"
  wandb_project_name: "cbg"
  wandb_run_name: "cbg_v5_smoke_1b"
  reference_mode: "disabled_adapter"
  beavertails_path: "data/beavertails_with_refusals_train.json"
  defense_size: 4000
  attack_size: 1000
  split_seed: 0
  data_shuffle: False
  context_length: 256
  lora_rank: 8
  lora_alpha: 16
  lora_dropout: 0.0
  lora_bias: "none"
  lora_target_modules: ["q_proj", "v_proj"]
  benign_token_blocks: 2
  functional_chunk_size: 1
  preservation_chunk_size: 1
  cbg_attention_implementation: "eager"
  damping_mode: "relative"
  damping_fraction: 0.05
  damping_calibration_directions: 8
  mu_floor: !!float 1e-8
  alpha: 1.0
  beta: 0.001
  beta_mode: "fixed"
  dual_max_size: 64
  dual_tolerance: 0.0001
  dual_kernel_tolerance: 0.00001
  # Optional --geometry_solver bounded_ritz uses these declared tolerances.
  ritz_initial_size: 2
  ritz_max_size: 6
  ritz_max_enrichments: 4
  ritz_residual_tolerance: 0.0001
  ritz_orthogonality_tolerance: 0.00001
  enclosure_atol: !!float 1e-6
  enclosure_rtol: 0.001
  enclosure_rho_scale: 1.0
