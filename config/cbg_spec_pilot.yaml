# CBG method v2 (cbg_version=spec, not the legacy raw-rho cbg_version=v2).
# These are explicit, UNCALIBRATED pilot choices,
# not author-selected paper hyperparameters. Run T1--T8 and target-precision T6
# before large-model training; this config does not establish a VRAM budget.
TrainingArguments:
  output_dir: output/cbg_spec_pilot
  per_device_train_batch_size: 1  # one preassembled joint batch: m=8, n=32
  gradient_accumulation_steps: 1
  max_steps: 100
  learning_rate: 0.00002
  weight_decay: 0.0
  optim: adamw_torch
  lr_scheduler_type: cosine
  warmup_ratio: 0.1
  max_grad_norm: 1.0
  bf16: false
  fp16: false
  tf32: false
  gradient_checkpointing: false
  torch_compile: false
  remove_unused_columns: false
  dataloader_drop_last: true
  dataloader_num_workers: 0
  logging_steps: 1
  save_steps: 25
  save_total_limit: 2
  save_only_model: false
  report_to: none
  seed: 42
  data_seed: 42

CbgArguments:
  method: cbg
  cbg_version: spec
  spec_method_revision: cbg_v2
  mu_mode: differentiated
  estimator: shared_sign
  capture_dtype: model  # FP32 capture for numerical qualification; bf16 is explicit compression
  capture_offload: true
  logprob_chunk_size: 128
  lazy_period: 1
  lazy_rescale: true
  log_gradient_components: false # enable for diagnostic runs; costs extra model passes
  geometry_solver: exact
  spectral_derivative_backend: centered_fd
  parameter_space: full
  reference_mode: separate_model
  model_name: meta-llama/Llama-3.2-1B-Instruct
  wandb_project_name: cbg-spec
  beavertails_path: data/beavertails_with_refusals_train.json
  defense_size: 4000
  attack_size: 1000
  split_seed: 2026
  data_shuffle: true
  safety_batch_size: 8
  benign_batch_size: 32
  spectral_modes: 4
  # Total sequence caps including prompt and response.
  safety_max_length: 256
  benign_max_length: 128
  transformer_block_path: model.layers
  gram_max_bytes: 67108864
  cbg_attention_implementation: eager
  damping_mode: relative
  spec_damping: relative
  fisher: sampled
  kl_direction: reference_to_current
  xi: 0.001
  kappa_mu: 0.05
  relative_radius: 0.001
  alpha: 1.0
  beta: 0.01
  beta_mode: fixed
  detach_lambda: false
  num_sign_draws: 1
