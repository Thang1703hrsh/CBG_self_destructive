# CBG V5 qualification candidate for the SEAM-style Llama2-7B main setting.
# This gated backbone must pass a five-step H100 qualification before a
# 500-step main run. Numerical thresholds are explicit starting values, not
# claims transferred from the Qwen2.5-7B qualification.
TrainingArguments:
  output_dir: "ckpt/cbg_v5_llama2_7b_main_seed42"
  per_device_train_batch_size: 8
  gradient_accumulation_steps: 1
  max_steps: 500
  learning_rate: !!float 2e-5
  weight_decay: 0.0
  optim: "adamw_torch"
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.1
  max_grad_norm: null

  bf16: False
  fp16: False
  tf32: False
  gradient_checkpointing: False
  torch_compile: False

  logging_steps: 1
  save_strategy: "steps"
  save_steps: 250
  save_total_limit: 2
  save_only_model: False
  report_to: "none"
  remove_unused_columns: False
  dataloader_drop_last: True
  dataloader_num_workers: 0
  dataloader_pin_memory: True
  dataloader_persistent_workers: False
  seed: 42
  data_seed: 42

CbgArguments:
  method: "cbg"
  cbg_version: "v5"
  spectral_derivative_backend: "direct_rof"
  geometry_solver: "dual"

  model_name: "meta-llama/Llama-2-7b-chat-hf"
  tokenizer_name: "meta-llama/Llama-2-7b-chat-hf"
  wandb_project_name: "cbg-v5"
  wandb_run_name: "cbg-v5-llama2-7b-main-seed42"
  reference_mode: "disabled_adapter"

  beavertails_path: "data/beavertails_with_refusals_train.json"
  defense_size: 4000
  attack_size: 1000
  split_seed: 2026
  data_shuffle: True
  context_length: 256

  parameter_space: "lora"
  lora_rank: 8
  lora_alpha: 16
  lora_dropout: 0.0
  lora_bias: "none"
  lora_target_modules: ["q_proj", "v_proj"]

  benign_token_blocks: 2
  # Conservative 7B qualification sizes. They stream the same complete batch
  # and do not change the finite-batch objective.
  functional_chunk_size: 1
  preservation_chunk_size: 4
  cbg_attention_implementation: "eager"

  damping_mode: "absolute"
  mu: 0.001
  damping_fraction: 0.05
  damping_calibration_directions: 8
  mu_floor: !!float 1e-8

  alpha: 1.0
  # Calibrate beta from Llama2 gradients; do not transfer a fixed beta chosen
  # for another backbone. This number is only the degenerate fallback.
  beta: 0.00002
  beta_mode: "grad_ratio"
  beta_target_ratio: 0.25
  beta_calibration_steps: 10
  beta_min: !!float 1e-7
  beta_max: 0.001

  dual_max_size: 64
  dual_tolerance: 0.0001
  # Starting qualification gate. It must be retained or revised from measured
  # Llama2 operator errors, with value and residual tolerances kept separate.
  dual_residual_tolerance: 0.0005
  dual_kernel_tolerance: 0.00001
  dual_column_batch_size: 2
  dual_column_fallback: True
  dual_refinement_steps: 3

  ritz_initial_size: 2
  ritz_max_size: 6
  ritz_max_enrichments: 4
  ritz_residual_tolerance: 0.0001
  ritz_orthogonality_tolerance: 0.00001
  enclosure_atol: !!float 1e-6
  enclosure_rtol: 0.001
  enclosure_rho_scale: 1.0
