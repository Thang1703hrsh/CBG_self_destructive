# Diagnostic configuration, not an assertion that this hardware budget suffices.
TrainingArguments:
  output_dir: "ckpt/cbg_smoke_1b"
  per_device_train_batch_size: 8
  max_steps: 50
  learning_rate: !!float 3e-5
  weight_decay: 0.0
  save_strategy: "steps"
  save_steps: 25
  save_total_limit: 2
  save_only_model: False
  logging_steps: 1
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.1
  gradient_accumulation_steps: 1
  report_to: "wandb"
  bf16: True
  fp16: False
  optim: "adamw_torch"
  max_grad_norm: null
  gradient_checkpointing: False
  remove_unused_columns: False
  dataloader_drop_last: True
  seed: 42

CbgArguments:
  method: "cbg"
  model_name: "meta-llama/Llama-3.2-1B-Instruct"
  tokenizer_name: "meta-llama/Llama-3.2-1B-Instruct"
  wandb_project_name: "cbg"
  wandb_run_name: "cbg_smoke_1b"
  reference_mode: "disabled_adapter"
  beavertails_path: "data/beavertails_with_refusals_train.json"
  defense_size: 4000
  attack_size: 1000
  split_seed: 0
  data_shuffle: False
  context_length: 256
  lora_rank: 8
  lora_alpha: 16
  lora_dropout: 0.0
  lora_bias: "none"
  lora_target_modules: ["q_proj", "v_proj"]
  functional_chunk_size: 1
  preservation_chunk_size: 1
  cbg_attention_implementation: "eager"
  inner_steps: 2
  inner_lr: 0.01
  inner_policy: "adaptive"
  inner_initial_steps: 8
  inner_max_steps: 20
  inner_max_backtracks: 4
  inner_residual_tolerance: 0.05
  inner_rayleigh_tolerance: 0.01
  # The smoke job collects failures; the main candidate fails on nonconvergence.
  inner_fail_on_nonconvergence: False
  damping_mode: "relative"
  mu: 0.001
  damping_fraction: 0.05
  damping_calibration_directions: 8
  mu_floor: !!float 1e-8
  eps_norm: !!float 1e-12
  tau_fd: !!float 1e-4
  theta_floor: 0.001
  u_floor: !!float 1e-12
  alpha: 1.0
  beta: 0.001
  beta_mode: "grad_ratio"
  beta_target_ratio: 0.25
  beta_calibration_steps: 10
  beta_min: 0.0
  beta_max: 0.1
  cbg_resume_from_checkpoint: null
