<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Human–AI Alignment · Visual Map</title>
<style>
*{box-sizing:border-box}body{margin:0;background:white;color:#192b32;font-family:'Segoe UI',Arial,sans-serif}
main{max-width:1500px;margin:auto;padding:20px}svg{display:block;width:100%;height:auto}
text{fill:#192b32}.heading{font-family:'Trebuchet MS',sans-serif;font-weight:700;letter-spacing:1px}
.leaf{font-size:17px;font-weight:600}.icon{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.segment{transition:filter .2s}.segment:hover{filter:brightness(1.04)}
@media(max-width:700px){main{padding:4px}}@media print{main{padding:0;max-width:none}}
</style>
</head>
<body>
<main>
<svg id="map" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1080" role="img" aria-labelledby="title description">
<title id="title">Human–AI Alignment</title>
<desc id="description">Specification, supervision, mechanisms and assurance, with their components and applications in chat, code, math, multimodal systems, agents, robotics and healthcare.</desc>
<defs>
<pattern id="pencil" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(-30)"><path d="M0 0V9" stroke="white" stroke-width="2" opacity=".35"/></pattern>
<symbol id="person" viewBox="0 0 32 32"><circle cx="16" cy="9" r="5"/><path d="M5 28v-4c0-6 22-6 22 0v4M11 28v-5m10 5v-5"/></symbol>
<symbol id="robot" viewBox="0 0 32 32"><rect x="5" y="9" width="22" height="19" rx="4"/><path d="M16 9V4m-3 0h6M2 16v7m28-7v7m-18-1h8"/><circle cx="11" cy="16" r="1.4"/><circle cx="21" cy="16" r="1.4"/></symbol>
<symbol id="shield" viewBox="0 0 32 32"><path d="M16 3 27 7v9c0 7-11 13-11 13S5 23 5 16V7Z"/><path d="m10 15 4 4 8-9"/></symbol>
<symbol id="sliders" viewBox="0 0 32 32"><path d="M4 8h24M4 16h24M4 24h24"/><rect x="9" y="5" width="4" height="6" rx="1" fill="white"/><rect x="20" y="13" width="4" height="6" rx="1" fill="white"/><rect x="12" y="21" width="4" height="6" rx="1" fill="white"/></symbol>
<symbol id="chat" viewBox="0 0 32 32"><path d="M5 5h22v17H14l-8 6v-6H5Z"/><path d="M10 11h12M10 16h8"/></symbol>
<symbol id="code" viewBox="0 0 32 32"><rect x="2" y="4" width="28" height="23" rx="3"/><path d="M2 10h28m-19 5-4 4 4 4m10-8 4 4-4 4m-3-10-4 13"/></symbol>
<symbol id="math" viewBox="0 0 32 32"><rect x="5" y="3" width="22" height="26" rx="3"/><path d="M10 8h12M10 15h5m-2.5-2.5v5M20 15h3M10 22h5m5-1h3m-3 3h3"/></symbol>
<symbol id="media" viewBox="0 0 32 32"><rect x="3" y="5" width="23" height="20" rx="2"/><circle cx="10" cy="11" r="2"/><path d="m4 22 8-7 5 5 4-4 5 6m3-11v18H8"/></symbol>
<symbol id="health" viewBox="0 0 32 32"><path d="M16 28 4 16C-3 5 11-1 16 9 22-1 35 5 28 16Z"/><path d="M10 16h12m-6-6v12"/></symbol>
<symbol id="search" viewBox="0 0 32 32"><circle cx="13" cy="13" r="9"/><path d="m20 20 9 9M9 13h8m-4-4v8"/></symbol>
<symbol id="document" viewBox="0 0 32 32"><path d="M7 3h13l6 6v20H7Zm13 0v7h6M12 15h9m-9 5h9m-9 5h6"/></symbol>
<symbol id="network" viewBox="0 0 32 32"><path d="m7 7 18 2-9 16Zm0 0 9 18M7 7l9 8 9-6m-9 6v10"/><circle cx="7" cy="7" r="3" fill="white"/><circle cx="25" cy="9" r="3" fill="white"/><circle cx="16" cy="25" r="3" fill="white"/></symbol>
</defs>
<g id="rings"></g><g id="center"></g><g id="applications"></g>
</svg>
</main>
<script>
'use strict';
// Edit these arrays to change the diagram. All artwork is local, editable SVG.
const groups=[
{name:'SPECIFICATION',start:184,end:266,fill:'#31dca8',light:'#b4edca',edge:'#358b78',items:[
['Context &\nDrift','network'],['Task &\nAssistance','document'],['Safety','shield'],['Personalized','person'],['Pluralistic','network']]},
{name:'SUPERVISION',start:274,end:356,fill:'#aad6f0',light:'#d2e7f6',edge:'#4c87b0',items:[
['Human','person'],['AI','robot'],['Verifiable','shield'],['Demo /\nPreference','document'],['Critique /\nProcess','chat'],['Oversight','search']]},
{name:'MECHANISMS',start:4,end:86,fill:'#ff767e',light:'#ffc1bb',edge:'#cc5b66',items:[
['SFT','document'],['Preference\nOpt.','sliders'],['RL','network'],['Distillation','document'],['Search /\nSteering','search']]},
{name:'ASSURANCE',start:94,end:176,fill:'#b395ee',light:'#ddd0f6',edge:'#8771b7',items:[
['Evaluator\nReliability','shield'],['Robustness','network'],['Preservation','document'],['Monitoring','search'],['Mechanistic\nEvidence','sliders']]}];
const NS='http://www.w3.org/2000/svg',cx=520,cy=540;
const svg=document.querySelector('#map'),defs=svg.querySelector('defs');
function el(tag,attrs={},text){const n=document.createElementNS(NS,tag);for(const [k,v] of Object.entries(attrs))n.setAttribute(k,v);if(text!==undefined)n.textContent=text;return n;}
function p(r,a){const t=a*Math.PI/180;return[cx+r*Math.cos(t),cy+r*Math.sin(t)];}
function arc(r,a,b){return 'M'+p(r,a)+' A'+r+','+r+' 0 '+(Math.abs(b-a)>180?1:0)+' '+(b>a?1:0)+' '+p(r,b);}
function band(ri,ro,a,b){return arc(ro,a,b)+' L'+p(ri,b)+' A'+ri+','+ri+' 0 0 0 '+p(ri,a)+' Z';}
function icon(parent,id,x,y,size,color){parent.append(el('use',{href:'#'+id,x:x-size/2,y:y-size/2,width:size,height:size,class:'icon',style:'color:'+color}));}
function multiline(parent,text,x,y,attrs={}){const lines=text.split('\n'),n=el('text',{x,y,'text-anchor':'middle',...attrs});lines.forEach((s,i)=>n.append(el('tspan',{x,dy:i?20:-(lines.length-1)*10},s)));parent.append(n);}
function curved(parent,text,id,r,a,b,size){defs.append(el('path',{id,d:arc(r,a,b)}));const n=el('text',{class:'heading',style:'font-size:'+size+'px'});n.append(el('textPath',{href:'#'+id,startOffset:'50%','text-anchor':'middle'},text));parent.append(n);}
const rings=document.querySelector('#rings');
groups.forEach((g,i)=>{
 const sector=el('g',{class:'segment'});
 sector.append(el('title',{},'Alignment '+g.name.toLowerCase()));
 sector.append(el('path',{d:band(177,319,g.start,g.end),fill:g.fill,stroke:g.edge,'stroke-width':1.3}));
 const bottom=g.start<180,a=bottom?g.end-8:g.start+8,b=bottom?g.start+8:g.end-8;
 curved(sector,'ALIGNMENT','heading-'+i,bottom?266:246,a,b,24);
 curved(sector,g.name,'name-'+i,bottom?230:282,a,b,26);
 rings.append(sector);
 const span=(g.end-g.start)/g.items.length;
 g.items.forEach(([label,symbol],j)=>{
  const a=g.start+j*span+1.1,b=g.start+(j+1)*span-1.1,angle=(a+b)/2;
  const tab=el('g',{class:'segment'});
  tab.append(el('path',{d:band(339,468,a,b),fill:g.light,stroke:g.edge,'stroke-width':1}));
  const [x,y]=p(411,angle),rotation=(angle>90&&angle<270)?angle+180:angle;
  const labelGroup=el('g',{transform:'translate('+x+' '+y+') rotate('+rotation+')'});
  multiline(labelGroup,label,0,5,{class:'leaf'});tab.append(labelGroup);
  const [ix,iy]=p(350,angle);icon(tab,symbol,ix,iy,15,g.edge);rings.append(tab);
 });
});
const center=document.querySelector('#center');
center.append(el('circle',{cx,cy,r:137,fill:'#fffdf8',stroke:'#e5ded2','stroke-width':1.5}));
center.append(el('path',{d:arc(154,-72,225),fill:'none',stroke:'#c78547','stroke-width':18,'stroke-linecap':'round'}));
center.append(el('path',{d:arc(154,-72,225),fill:'none',stroke:'url(#pencil)','stroke-width':14}));
const tip=p(154,231),left=p(139,217),right=p(170,217);
center.append(el('path',{d:'M'+tip+' L'+left+' Q'+p(154,222)+' '+right+' Z',fill:'#c78547',stroke:'#b57335','stroke-width':1.5,'stroke-linejoin':'round'}));
icon(center,'person',cx-54,cy-43,49,'#547c73');
icon(center,'robot',cx+54,cy-43,49,'#68799e');
center.append(el('path',{d:'M504 492h32m-6-5 6 5-6 5M536 506h-32m6-5-6 5 6 5',fill:'none',stroke:'#bb955d','stroke-width':2}));
center.append(el('text',{x:cx,y:cy+17,'text-anchor':'middle',style:'font-size:27px;font-weight:800;letter-spacing:.7px'},'HUMAN–AI'));
center.append(el('text',{x:cx,y:cy+49,'text-anchor':'middle',style:'font-size:27px;font-weight:800;letter-spacing:.7px'},'ALIGNMENT'));
center.append(el('text',{x:cx,y:cy+85,'text-anchor':'middle',style:'font-size:11px;letter-spacing:1.5px;fill:#978260'},'AN ITERATIVE PROCESS'));
const appsGroup=document.querySelector('#applications');
appsGroup.append(el('path',{d:'M1008 130 Q1120 540 1008 950',stroke:'#faedcf','stroke-width':6,fill:'none'}));
defs.append(el('path',{id:'app-label',d:'M1018 155 Q1130 540 1018 925'}));
const at=el('text',{style:'font-size:22px;letter-spacing:1.4px;font-weight:500'});
at.append(el('textPath',{href:'#app-label',startOffset:'50%','text-anchor':'middle'},'ALIGNMENT SETTINGS / APPLICATIONS'));appsGroup.append(at);
const apps=[['Chat','chat'],['Code','code'],['Math / Reasoning','math'],['Multimodal','media'],['Agent','robot'],['Robotics','sliders'],['Healthcare','health']];
apps.forEach(([name,symbol],i)=>{
 const y=190+i*117,tilt=(i-3)*4,x=1164-Math.abs(i-3)*9;
 const card=el('g',{class:'segment',transform:'translate('+x+' '+y+') rotate('+tilt+')'});
 card.append(el('path',{d:'M-7-39 216-35 220 37 -3 41Z',fill:'#fff3d0',stroke:'#bc9639','stroke-width':1.3}));
 card.append(el('path',{d:'M-4-36 214-33',fill:'none',stroke:'#eed99f','stroke-width':1}));
 icon(card,symbol,182,0,35,'#826c3c');
 if(name==='Math / Reasoning')multiline(card,'Math /\nReasoning',79,-3,{style:'font-size:21px;font-weight:600'});
 else card.append(el('text',{x:78,y:8,'text-anchor':'middle',style:'font-size:23px;font-weight:600'},name));
 appsGroup.append(card);
});
</script>
</body>
</html>
